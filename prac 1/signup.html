<!DOCTYPE html>

</head>
<body>

    <h1 align="center">Student Hub Portal</h1>

    <hr>

    <h2 align="center">Student Registration</h2>

    <form align="center">

        <label>Full Name:</label><br>
        <input type="text" placeholder="Enter Full Name"><br><br>

        <label>Enrollment Number:</label><br>
        <input type="text" placeholder="Enter Enrollment Number"><br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter Email"><br><br>

        <label>Mobile Number:</label><br>
        <input type="tel" placeholder="Enter Mobile Number"><br><br>

        <label>Password:</label><br>
        <input type="password" placeholder="Create Password"><br><br>

        <label>Confirm Password:</label><br>
        <input type="password" placeholder="Confirm Password"><br><br>

        <input type="submit" value="Register">

        <br><br>

        Already have an account?
        <a href="login.html">Login</a>

        <br><br>
